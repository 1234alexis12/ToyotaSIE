# Orquestador multi-contenedor para el sistema empresarial SIG-Toyota
# Incluye: MySQL 8.0 Master-Slave, Redis Cache, Prometheus, Exporters y Grafana

services:
  # Servicio 1A: Base de Datos Maestro (Master - Escritura transaccional)
  db-master:
    image: mysql:8.0
    container_name: toyota_mysql_master
    restart: unless-stopped
    command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON
    environment:
      MYSQL_DATABASE: toyota_db
      MYSQL_ROOT_PASSWORD: '123456'
    ports:
      # Puerto 3310 en Windows/Workbench para no chocar con 3306 local ni 3308/3309
      - "3310:3306"
    volumes:
      - ./database/toyota_db.sql:/docker-entrypoint-initdb.d/01_toyota_db.sql:ro
      - ./database/init_master_repl.sql:/docker-entrypoint-initdb.d/02_master_repl.sql:ro
      - toyota_master_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Servicio 1B: Base de Datos Esclavo (Slave / Read Replica - Solo lectura)
  db-slave:
    image: mysql:8.0
    container_name: toyota_mysql_slave
    restart: unless-stopped
    command: --server-id=2 --relay-log=mysql-relay-bin --gtid-mode=ON --enforce-gtid-consistency=ON --log-replica-updates=ON --read-only=ON
    environment:
      MYSQL_ROOT_PASSWORD: '123456'
    ports:
      # Puerto 3311 en Windows/Workbench para consultar la replica de lectura
      - "3311:3306"
    volumes:
      - toyota_slave_data:/var/lib/mysql
    depends_on:
      db-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Servicio 1C: Inicializador automatico del enlace de replicacion Master -> Slave
  db-replica-init:
    image: mysql:8.0
    container_name: toyota_repl_init
    restart: "no"
    depends_on:
      db-master:
        condition: service_healthy
      db-slave:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        set -e
        for i in $$(seq 1 30); do
          if mysqladmin ping -h db-master -uroot -p123456 --silent >/dev/null 2>&1 && \
             mysqladmin ping -h db-slave -uroot -p123456 --silent >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done

        echo "Verificando estado de replicacion en db-slave..."
        IO_RUNNING=$$(mysql -h db-slave -uroot -p123456 -Nse "SHOW REPLICA STATUS\G" | awk '/Replica_IO_Running:/ {print $$2}')
        if [ "$$IO_RUNNING" != "Yes" ]; then
          echo "Configurando replicacion GTID hacia db-master..."
          mysql -h db-slave -uroot -p123456 -e "
            STOP REPLICA;
            RESET REPLICA ALL;
            CHANGE REPLICATION SOURCE TO
              SOURCE_HOST='db-master',
              SOURCE_PORT=3306,
              SOURCE_USER='repl_toyota',
              SOURCE_PASSWORD='ReplicaPass2026!',
              SOURCE_AUTO_POSITION=1,
              GET_SOURCE_PUBLIC_KEY=1;
            START REPLICA;
            SET PERSIST read_only = ON;
            SET PERSIST super_read_only = ON;
          "
        else
          echo "Replicacion ya activa en db-slave."
        fi
        echo "Esperando sincronizacion de toyota_db en db-slave..."
        for i in $$(seq 1 30); do
          if mysql -h db-slave -uroot -p123456 -Nse "SELECT COUNT(*) FROM toyota_db.usuarios;" >/dev/null 2>&1; then
            echo "Replicacion sincronizada correctamente."
            mysql -h db-slave -uroot -p123456 -e "SHOW REPLICA STATUS\G" | grep -E "Replica_IO_Running|Replica_SQL_Running|Seconds_Behind_Source|Executed_Gtid_Set"
            exit 0
          fi
          sleep 1
        done
        echo "Tiempo agotado esperando toyota_db en db-slave" >&2
        exit 1

  # Servicio 2: Cache en memoria Redis (aceleracion de lecturas y KPIs)
  redis:
    image: redis:7-alpine
    container_name: toyota_redis
    restart: unless-stopped
    ports:
      # Puerto 6380 en Windows para no chocar con el 6379 de otros proyectos
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servicio 3: Backend API REST en Python Flask (Read/Write Splitting + Cache + /metrics)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toyota_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: db-master
      MYSQL_PORT: 3306
      MYSQL_SLAVE_HOST: db-slave
      MYSQL_SLAVE_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: '123456'
      MYSQL_DATABASE: toyota_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 5000
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-}
    depends_on:
      db-master:
        condition: service_healthy
      db-slave:
        condition: service_healthy
      db-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Servicio 4: Frontend Web React servido mediante Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: toyota_frontend
    restart: unless-stopped
    ports:
      # Puerto HTTP en 8080 para no chocar con el puerto 80 ocupado por otros contenedores
      - "8080:80"
    depends_on:
      - backend

  # Servicio 5A: Exporter de metricas MySQL Master (solo red interna Docker)
  mysql-master-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: toyota_mysql_master_exporter
    restart: unless-stopped
    command:
      - "--config.my-cnf=/.my.cnf"
      - "--mysqld.address=db-master:3306"
    volumes:
      - ./monitoring/mysql/master.my.cnf:/.my.cnf:ro
    depends_on:
      db-master:
        condition: service_healthy

  # Servicio 5B: Exporter de metricas MySQL Slave (solo red interna Docker)
  mysql-slave-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: toyota_mysql_slave_exporter
    restart: unless-stopped
    command:
      - "--config.my-cnf=/.my.cnf"
      - "--mysqld.address=db-slave:3306"
      - "--collect.slave_status"
    volumes:
      - ./monitoring/mysql/slave.my.cnf:/.my.cnf:ro
    depends_on:
      db-slave:
        condition: service_healthy

  # Servicio 5C: Exporter de metricas Redis (solo red interna Docker)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: toyota_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # Servicio 5D: Exporter de recursos de la VM / Host (CPU, RAM, Disco, Load, Red)
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: toyota_node_exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  # Servicio 5E: cAdvisor para CPU, RAM y Red por cada contenedor Docker
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    container_name: toyota_cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=10s'
      - '--store_container_labels=false'
      - '--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  # Servicio 6: Recolector de metricas Prometheus (http://localhost:9091)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: toyota_prometheus
    restart: unless-stopped
    ports:
      # Puerto 9091 para no chocar con el 9090 de otros proyectos
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - toyota_prometheus_data:/prometheus
    depends_on:
      - backend
      - mysql-master-exporter
      - mysql-slave-exporter
      - redis-exporter
      - node-exporter
      - cadvisor

  # Servicio 7: Visualizacion interactiva Grafana (http://localhost:3001)
  grafana:
    image: grafana/grafana:10.4.1
    container_name: toyota_grafana
    restart: unless-stopped
    ports:
      # Puerto 3001 para no chocar con el 3000 de otros proyectos
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: 'admin'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - toyota_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  toyota_master_data:
    driver: local
  toyota_slave_data:
    driver: local
  toyota_prometheus_data:
    driver: local
  toyota_grafana_data:
    driver: local
