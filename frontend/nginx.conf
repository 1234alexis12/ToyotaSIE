# Configuracion de servidor Nginx para la aplicacion web React
server {
    # Escucha en el puerto 80 estandar HTTP
    listen 80;
    server_name localhost;

    # Directorio de archivos estaticos generados por Vite
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enrutamiento de aplicacion SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para reenviar peticiones API hacia el contenedor Flask
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Desactivar logs para favicon no encontrado
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
