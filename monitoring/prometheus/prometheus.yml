global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'sig-toyota-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']

  - job_name: 'mysql-master'
    static_configs:
      - targets: ['mysql-master-exporter:9104']

  - job_name: 'mysql-slave'
    static_configs:
      - targets: ['mysql-slave-exporter:9104']

  - job_name: 'redis-cache'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'vm-host'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'docker-containers'
    static_configs:
      - targets: ['cadvisor:8080']
